name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      name:
        description: 'Manually release'
        required: false
        default: 'Mona the Octocat'

jobs:

   release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v3

      - name: Set up Go 1.23.7
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.7

      # Never cut a release out of a tree that does not pass vet and tests.
      - name: Check
        run: make check

      - name: Build
        run: make release

      - name: Pack
        run: bash "${{ github.workspace }}/.github/helpers/pack4release.sh"

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "dist/*.tar.gz"
          # Auto-generated notes are a reasonable starting point for a brand new
          # release, but a re-run must not wipe notes that were written by hand:
          # without the omit* flags below this step overwrites the body and the
          # name of an existing release every time it runs.
          generateReleaseNotes: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}