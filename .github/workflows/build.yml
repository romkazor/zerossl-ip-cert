name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '**Makefile'
      - '**.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  build-linux:
    name: Build all
    runs-on: ubuntu-latest
    steps:

      # Checkout first: setup-go needs the checked out go.mod to resolve caching.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v3

      - name: Set up Go 1.23.7
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.7

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . exec)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: make vet

      # The live API tests skip themselves: ZEROSSL_API_KEY is not set in CI.
      - name: Test
        run: make test

      - name: Build
        run: make release
